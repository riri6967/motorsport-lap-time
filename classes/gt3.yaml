# GT3 -- generic Balance-of-Performance specification.
#
# Second class, per the build order in CLAUDE.md. GT3 is not a spec formula:
# a dozen manufacturers build to it and the SRO equalises them event by event
# with Balance of Performance, adjusting weight, power, aerodynamics and fuel
# capacity per car and per circuit.
#
# That makes "a GT3" a different kind of object to "an Oreca 07". This file
# describes the BoP *target* -- the performance envelope every car is being
# adjusted towards -- rather than any one manufacturer's machine. It is the
# right thing to compare against a class lap record, which is set by whichever
# car was best placed on the day, and the wrong thing to use if you want to
# know what a specific car does. For that, apply per-car BoP on top: the
# `bop` block below is reserved for exactly that and the loader accepts it.
#
#   REGULATED   Weight and power sit inside published BoP windows.
#   ESTIMATED   Everything else. GT3 aerodynamics are not published, and the
#               tyre is a control tyre nobody models publicly.
#
# Post-calibration validation (see PROGRESS.md) leaves Monza and Spa slow in
# a way that tracks top speed: tools/sensitivity.py's drag probe matches the
# shape of that shortfall far better than downforce, grip or power do, which
# reads as real teams trimming less drag at power circuits than at technical
# ones -- the same kind of choice classes/lmp2.yaml's Le Mans-kit-as-a-
# separate-file split makes, just continuous within one BoP package rather
# than a discrete swap. `aero_trim:` below (see engine/config.py's
# VehicleSpec.aero_for) is exactly the mechanism for that, keyed by circuit
# name. It is deliberately unused here: with five circuits and up to two
# free numbers each, fitting a trim to close this residual would fit every
# point exactly and prove nothing -- the same failure mode
# tools/calibrate.py's leave-one-out check exists to catch for the global
# coefficients, just sidestepped instead of caught. Add an entry only on the
# strength of independent evidence (a cited, known lower-drag setup for a
# named circuit), not by reverse-engineering one from this file's own
# validation gap.

name: GT3
description: >-
  Balance-of-Performance target for a GT3 car in sprint trim: production-based
  silhouette, considerably less downforce and considerably more drag than a
  prototype, and about two thirds of the power-to-weight.

mass:
  vehicle_kg: 1265.0         # REGULATED: mid of the usual 1220-1350 kg BoP window
  driver_kg: 80.0
  fuel_kg: 20.0
  fuel_capacity_kg: 89.4     # REGULATED: 120 L is a common BoP capacity
  weight_dist_front: 0.48    # front- or mid-engined production layouts
  cg_height_m: 0.38          # ESTIMATED: much higher than a prototype
  wheelbase_m: 2.65          # PUBLISHED: typical of the class

aero:
  # ESTIMATED. About 1000 kg of downforce at 250 km/h is the figure usually
  # quoted for the class, which puts ClA near 3.3; a production silhouette is
  # draggy, so the lift-to-drag ratio is around 2.7 against an LMP2's 4.3.
  cla: 3.71660
  cda: 0.8610
  balance_front: 0.42
  rho_air: 1.225

powertrain:
  max_power_w: 373000        # REGULATED: ~500 hp, mid of the BoP window
  efficiency: 0.90           # ESTIMATED: production-derived driveline
  drive: rwd
  max_tractive_force_n: 22000
  thermal_efficiency: 0.30
  fuel_energy_mj_per_kg: 43.0

tyres:
  # ESTIMATED. A control slick, narrower than a prototype's and carrying more
  # weight, so a lower peak and more load sensitivity.
  mu_x: 1.5171
  mu_y: 1.5705
  load_sensitivity: 0.16
  ellipse_exponent: 2.00
  wear_model: distance
  grip_loss_per_lap: 0.0010
  reference_lap_m: 5000.0
  min_grip: 0.86

brakes:
  max_force_n: 42000.0       # ESTIMATED: steel discs on most of the class

rolling_resistance: 0.014

sources:
  - "SRO/FIA GT3 Balance of Performance tables: weight and power windows"
  - "Aerodynamic and tyre coefficients are engineering estimates, not yet
     calibrated; see tools/calibrate.py"
